            const FALLBACK_ICONS = {

                discord: `<svg viewBox="0 0 64 64" fill="none"><path d="M48.6 17.2A41 41 0 0038.4 14l-1.3 2.7a37 37 0 00-10.2 0L25.6 14a41 41 0 00-10.2 3.2C8.9 27 7.1 36.5 8 45.9A41.5 41.5 0 0020.5 52l2.7-3.7a26.7 26.7 0 01-4.2-2l1-.8a29.3 29.3 0 0024 0l1 .8c-1.3.8-2.7 1.5-4.2 2L43.5 52A41.5 41.5 0 0056 45.9c1.1-10.9-1.9-20.3-7.4-28.7zM24.2 40.1c-2.4 0-4.4-2.2-4.4-4.9s1.9-4.9 4.4-4.9c2.5 0 4.5 2.2 4.4 4.9 0 2.7-1.9 4.9-4.4 4.9zm15.6 0c-2.4 0-4.4-2.2-4.4-4.9s1.9-4.9 4.4-4.9c2.5 0 4.5 2.2 4.4 4.9 0 2.7-1.9 4.9-4.4 4.9z" fill="#fff"/></svg>`,

                galery: `<svg viewBox="0 0 64 64" fill="none"><rect x="10" y="13" width="44" height="38" rx="9" stroke="#fff" stroke-width="4.5" fill="rgba(255,255,255,0.2)"/><circle cx="23" cy="25" r="4.5" fill="#fff"/><path d="M13 45l13-13 9 9 7-7 9 11" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
                default: `<svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="19" fill="#fff" fill-opacity="0.9"/><circle cx="26" cy="25" r="5" fill="#8cf6ff"/></svg>`

            const FALLBACK_GALLERY_SVGS = [
                `linear-gradient(135deg, #0077e6 0%, #00e1ff 52%, #7affa6 100%)`,

                `linear-gradient(135deg, #0ba360 0%, #3cba92 50%, #7ef9ff 100%)`,

            /* =======================================================================
               2. APPLY WALLPAPER PNG + SPAWN PURE-CSS FLOATING DROPLETS
               ======================================================================= */
            function applyWallpaper() {
                if (CFG.backgroundPng && CFG.backgroundPng.trim() !== "") {
                    const safeUrl = CFG.backgroundPng.trim().replace(/"/g, '\\"');
                    rootEl.style.setProperty("--bg-image", `url("${safeUrl}")`);
                } else {
                    const encoded = encodeURIComponent(DEFAULT_AERO_WALLPAPER_SVG.trim());
                    rootEl.style.setProperty("--bg-image", `url("data:image/svg+xml;utf8,${encoded}")`);
                }
            }
            applyWallpaper();

            const ambientContainer = document.getElementById("ambientBubbles");
            const ambientFrag = document.createDocumentFragment();
            [
                { size: 22, left: "8%", dur: "11s", delay: "-2s" },
                { size: 36, left: "24%", dur: "15s", delay: "-7s" },
                { size: 28, left: "39%", dur: "13s", delay: "-9s" },
                { size: 18, left: "52%", dur: "10s", delay: "-4s" },

                { size: 44, left: "76%", dur: "17s", delay: "-11s" },
                { size: 26, left: "90%", dur: "13s", delay: "-1s" }
            ].forEach(cfg => {
                const d = document.createElement("div");
                d.className = "ambient-drop";
                d.style.width = d.style.height = cfg.size + "px";
                d.style.left = cfg.left;
                d.style.animationDuration = cfg.dur;
                d.style.animationDelay = cfg.delay;
                ambientFrag.appendChild(d);
            });
            ambientContainer.appendChild(ambientFrag);

            /* =======================================================================
               3. PROCEDURAL WATER DROPLET SFX
               ======================================================================= */
            let soundEnabled = Boolean(CFG.enableWaterSounds);
            let audioCtx = null;
            const soundBtn = document.getElementById("sound-toggle");

            function syncSoundIcon() {
                soundBtn.textContent = soundEnabled ? "💧" : "🔇";
                soundBtn.style.opacity = soundEnabled ? "1" : "0.65";
            }
            syncSoundIcon();

            function playWaterBloop(fStart = 310, fEnd = 690, duration = 0.095, vol = 0.08) {
                if (!soundEnabled) return;
                try {
                    if (!audioCtx) {
                        const AC = window.AudioContext || window.webkitAudioContext;
                        if (!AC) return;
                        audioCtx = new AC();
                    }
                    if (audioCtx.state === "suspended") audioCtx.resume();
                    const now = audioCtx.currentTime;
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = "sine";
                    osc.frequency.setValueAtTime(fStart, now);
                    osc.frequency.exponentialRampToValueAtTime(fEnd, now + duration);
                    gain.gain.setValueAtTime(0.001, now);
                    gain.gain.linearRampToValueAtTime(vol, now + duration * 0.22);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + duration + 0.01);
                } catch (_) { }
            }

            soundBtn.addEventListener("click", () => {
                soundEnabled = !soundEnabled;
                syncSoundIcon();
                if (soundEnabled) playWaterBloop(360, 780, 0.1, 0.09);

                if (e.target === lightboxEl) {
                    playWaterBloop(600, 300, 0.08, 0.07);
                    lightboxEl.classList.remove("open");

            function escapeHtml(str) {
                return String(str || "")
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;");
            }

            const dockOrbEls = [];
            const orbSprings = [];
            const orbMetrics = []; // Cached { x, y, r } screen positions (avoids getBoundingClientRect)
            const orbRenderCache = []; // Dirty-checking state per orb

            function buildDock() {
                const frag = document.createDocumentFragment();
                dockOrbEls.length = 0;
                orbSprings.length = 0;
                orbMetrics.length = 0;
                orbRenderCache.length = 0;

                PROFILES.forEach((prof, idx) => {

                    orb.className = "dock-orb" + (idx === 0 ? " is-selected" : "");
                    orb.setAttribute("aria-label", prof.title);
                    orb.style.setProperty("--orb-accent", prof.accent || "#00d4ff");

                    const refl = document.createElement("div");
                    refl.className = "dock-orb-reflection";
                    orb.appendChild(refl);

                    const logoWrap = document.createElement("div");
                    logoWrap.className = "dock-logo-wrap";
                    const fallbackSvg = FALLBACK_ICONS[prof.id] || FALLBACK_ICONS.default;

                    if (prof.logoPng && prof.logoPng.trim() !== "") {
                        const img = document.createElement("img");
                        img.src = prof.logoPng.trim();
                        img.alt = prof.title;
                        img.decoding = "async";
                        img.onerror = () => { logoWrap.innerHTML = fallbackSvg; };
                        logoWrap.appendChild(img);
                    } else {
                        logoWrap.innerHTML = fallbackSvg;
                    }

                    orb.appendChild(logoWrap);
                    frag.appendChild(orb);
                    dockOrbEls.push(orb);
                    orbSprings.push({ pos: 0, vel: 0 });
                    orbMetrics.push({ x: 0, y: 0, r: 32 });
                    orbRenderCache.push({ visible: true, z: -1, selected: idx === 0 });
                });

                dockTrackEl.replaceChildren(frag);
            }

            // Cached DOM nodes per profile so Genie tab switches don't re-parse HTML
            const profileDomCache = new Array(PROFILES.length).fill(null);
            let cardEls = [];
            let cardRenderCache = [];

            function createProfileDom(profIdx) {
                if (profileDomCache[profIdx]) return profileDomCache[profIdx];
                const prof = PROFILES[profIdx];
                if (!prof) return null;

                const cards = prof.cards || [];
                const builtCards = [];
                const builtDots = [];

                cards.forEach((card, cIdx) => {
                    const bubble = document.createElement("article");
                    bubble.className = "info-bubble";

                    let html = `
            <div class="bubble-rim-reflection"></div>
            <div class="bubble-specular-crown"></div>
            <div class="bubble-caustic-floor"></div>
            <div class="bubble-inner">
              <div class="card-top-row">
                <span class="card-badge">${escapeHtml(card.badge || `0${cIdx + 1} / INFO`)}</span>
                ${cards.length > 1 ? `<span class="swipe-hint-pill">🫧 Swipe ${cIdx + 1}/${cards.length}</span>` : ""}
              </div>
          `;

                    if (card.type === "about-hero") {
                        const hasAvatar = CFG.avatarPng && CFG.avatarPng.trim() !== "";
                        html += `
              <div class="hero-identity">
                <div class="avatar-orb">
                  <div class="avatar-orb-inner" data-avatar-slot>
                    ${hasAvatar
                                ? `<img src="${escapeHtml(CFG.avatarPng.trim())}" alt="Avatar" decoding="async" />`
                                : FALLBACK_ICONS.about}
                  </div>
                </div>
                <div class="hero-meta">
                  <h2>${escapeHtml(CFG.displayName || "AERO.SCULPTOR")}</h2>
                  <div class="hero-handle">${escapeHtml(CFG.handle || "@handle")}</div>
                  <div class="hero-status">${escapeHtml(CFG.statusText || "")}</div>
                </div>
              </div>
            `;
                    } else if (card.heading) {
                        html += `<h2 class="card-heading">${escapeHtml(card.heading)}</h2>`;
                    }

                    if (card.body) {
                        html += `<p class="card-body">${escapeHtml(card.body)}</p>`;
                    }

                    if (Array.isArray(card.tags) && card.tags.length) {
                        html += `<div class="tag-row">` +
                            card.tags.map(t => `<span class="aero-tag">${escapeHtml(t)}</span>`).join("") +
                            `</div>`;
                    }

                    if (Array.isArray(card.stats) && card.stats.length) {
                        html += `<div class="stats-stack">` +
                            card.stats.map(s => `
                <div class="stat-capsule">
                  <span class="stat-label">${escapeHtml(s.label)}</span>
                  <span class="stat-val">${escapeHtml(s.value)}</span>
                </div>
              `).join("") +
                            `</div>`;
                    }

                    if (typeof card.progressPercent === "number") {
                        const pct = Math.max(0, Math.min(100, card.progressPercent));
                        html += `
              <div class="progress-wrap">
                <div class="progress-header">
                  <span>${escapeHtml(card.progressLabel || "Progress")}</span>
                  <span>${pct}%</span>
                </div>
                <div class="aqua-tube">
                  <div class="aqua-tube-fill" style="width:${pct}%"></div>
                </div>
              </div>
            `;
                    }

                    if (card.type === "gallery" && Array.isArray(card.galleryItems)) {
                        html += `<div class="gallery-grid" data-gallery-grid></div>`;
                    }

                    if (card.copyValue || card.ctaUrl) {
                        html += `<div class="cta-group">`;
                        if (card.copyValue) {
                            html += `<button type="button" class="aqua-gel-btn secondary" data-copy="${escapeHtml(card.copyValue)}">📋 ${escapeHtml(card.copyLabel || "Copy")}</button>`;
                        }
                        if (card.ctaUrl) {
                            html += `<a class="aqua-gel-btn" href="${escapeHtml(card.ctaUrl)}" target="_blank" rel="noopener noreferrer">${escapeHtml(card.ctaText || "Open Link ↗")}</a>`;
                        }
                        html += `</div>`;
                    }

                    html += `</div>`;
                    bubble.innerHTML = html;

                    const avatarImg = bubble.querySelector("[data-avatar-slot] img");
                    if (avatarImg) {
                        avatarImg.addEventListener("error", () => {
                            if (avatarImg.parentElement) avatarImg.parentElement.innerHTML = FALLBACK_ICONS.about;
                        }, { once: true });
                    }

                    const galGrid = bubble.querySelector("[data-gallery-grid]");
                    if (galGrid && Array.isArray(card.galleryItems)) {
                        const galFrag = document.createDocumentFragment();
                        card.galleryItems.forEach((gItem, gIdx) => {
                            const thumb = document.createElement("div");
                            thumb.className = "gallery-bubble-thumb";
                            thumb.style.background = FALLBACK_GALLERY_SVGS[gIdx % FALLBACK_GALLERY_SVGS.length];

                            if (gItem.imagePng && gItem.imagePng.trim() !== "") {
                                const gImg = document.createElement("img");
                                gImg.src = gItem.imagePng.trim();
                                gImg.alt = gItem.title || `Work ${gIdx + 1}`;
                                gImg.decoding = "async";
                                gImg.loading = "lazy";
                                gImg.onerror = () => gImg.remove();
                                thumb.appendChild(gImg);
                            }

                            const cap = document.createElement("div");
                            cap.className = "gallery-thumb-caption";
                            cap.textContent = gItem.title || `Piece ${gIdx + 1}`;
                            thumb.appendChild(cap);

                            thumb.addEventListener("click", () => {
                                if (!cardGesture.wasDragged) openLightbox(gItem, gIdx);
                            });
                            galFrag.appendChild(thumb);
                        });
                        galGrid.appendChild(galFrag);
                    }

                    const copyBtn = bubble.querySelector("[data-copy]");
                    if (copyBtn) {
                        copyBtn.addEventListener("click", () => {
                            if (cardGesture.wasDragged) return;
                            const val = copyBtn.getAttribute("data-copy");
                            navigator.clipboard?.writeText(val).catch(() => { });
                            playWaterBloop(420, 880, 0.11, 0.1);
                            navigator.vibrate?.(10);
                            showToast(`Copied "${val}"! ✨`);
                            cardJellyVel += 1.6;
                            wakePhysics();
                        });
                    }

                    builtCards.push(bubble);

                    const dot = document.createElement("button");
                    dot.type = "button";
                    dot.className = "droplet-dot" + (cIdx === 0 ? " active" : "");
                    dot.setAttribute("aria-label", `Bubble ${cIdx + 1}`);
                    dot.addEventListener("click", () => goToCard(cIdx));
                    builtDots.push(dot);
                });

                const entry = { cards: builtCards, dots: builtDots };
                profileDomCache[profIdx] = entry;
                return entry;
            }

            function mountProfileCards(profIdx) {
                const prof = PROFILES[profIdx];
                if (!prof) return;

                rootEl.style.setProperty("--active-accent", prof.accent || "#00d4ff");
                categoryLabelEl.textContent = prof.title;

                const entry = createProfileDom(profIdx);
                cardEls = entry.cards;
                cardRenderCache = cardEls.map(() => ({ hidden: false, z: -1 }));

                for (let i = 0; i < cardEls.length; i++) {
                    const el = cardEls[i];
                    el.style.visibility = "visible";
                    el.style.pointerEvents = "auto";
                }

                stageEl.replaceChildren(...cardEls);
                paginationEl.replaceChildren(...entry.dots);
                paginationEl.style.display = entry.dots.length > 1 ? "flex" : "none";
                syncPaginationDots();
            }

            function syncPaginationDots() {
                const dots = paginationEl.children;
                for (let i = 0; i < dots.length; i++) {
                    dots[i].classList.toggle("active", i === activeCardIdx);
                }
            }

            /* =======================================================================
               5. CACHED LAYOUT GEOMETRY + JELLY WOBBLE + GENIE ENGINE
               ======================================================================= */
            const genieCanvas = document.getElementById("genie-canvas");
            const gCtx = genieCanvas.getContext("2d", { alpha: true });

            let vpW = window.innerWidth;
            let vpH = window.innerHeight;
            let dockOriginX = vpW * 0.5;
            let dockOriginY = vpH - 72;
            let dockBaseOrbRadius = 28;
            let cachedStageBox = { cx: vpW * 0.5, top: 90, bottom: vpH - 160, width: Math.min(vpW * 0.9, 420) };
            let canvasDirty = false;

            function updateLayoutCache() {
                vpW = window.innerWidth;
                vpH = window.innerHeight;

                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                genieCanvas.width = Math.round(vpW * dpr);
                genieCanvas.height = Math.round(vpH * dpr);
                gCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
                canvasDirty = true;

                // Measure dock center without triggering reflow during animations
                const trackRect = dockTrackEl.getBoundingClientRect();
                dockOriginX = trackRect.left + trackRect.width * 0.5;
                dockOriginY = trackRect.top + trackRect.height * 0.5;
                if (dockOrbEls[0] && dockOrbEls[0].offsetWidth > 0) {
                    dockBaseOrbRadius = dockOrbEls[0].offsetWidth * 0.5;
                }

                // Measure stage card box once cleanly on resize
                const sRect = stageEl.getBoundingClientRect();
                const sampleCard = cardEls[activeCardIdx];
                const sampleW = sampleCard && sampleCard.offsetWidth > 60
                    ? sampleCard.offsetWidth
                    : Math.min(vpW * 0.9, 420);
                const sampleH = sampleCard && sampleCard.offsetHeight > 60
                    ? sampleCard.offsetHeight
                    : sRect.height * 0.82;
                const cx = sRect.left + sRect.width * 0.5;
                const cy = sRect.top + sRect.height * 0.5;
                cachedStageBox = {
                    cx,
                    top: cy - sampleH * 0.5,
                    bottom: cy + sampleH * 0.5,
                    width: sampleW
                };
            }

            let activeProfileIdx = 0;
            let lastSelectedOrbIdx = 0;
            let lastFocusedPillIdx = -1;
            let activeCardIdx = 0;

            // Top Bubble Glide + Incompressible Jelly State
            let cardPos = 0;
            let cardVel = 0;
            let cardJellyStretch = 0;
            let cardJellyVel = 0;

            // Dock Carousel State
            let dockPos = 0;
            let dockTarget = 0;
            let dockVel = 0;

            // Smooth Tilt State (unified into main RAF loop)
            const tiltState = {
                curX: 0,
                curY: 0,
                targetX: 0,
                targetY: 0,
                lastCssX: "0.000",
                lastCssY: "0.000"
            };

            const genie = {
                phase: "idle",
                t: 0,
                fromIdx: 0,
                toIdx: 0,
                accentFrom: "#00d4ff",
                accentTo: "#00d4ff",
                cardBox: cachedStageBox,
                droplets: []
            };

            let physicsAwake = false;
            let lastFrameTime = 0;

            function wakePhysics() {
                if (!physicsAwake) {
                    physicsAwake = true;
                    lastFrameTime = performance.now();
                    requestAnimationFrame(stepPhysics);
                }
            }

            // O(1) math lookup — zero DOM reflows!
            function getOrbScreenCenter(idx) {
                return orbMetrics[idx] || { x: dockOriginX, y: dockOriginY, r: 32 };
            }

            function spawnSplashDroplets(x, y, color, dirY) {
                for (let i = 0; i < 6; i++) {
                    const angle = -Math.PI * 0.5 + (Math.random() - 0.5) * 1.5;
                    const speed = 90 + Math.random() * 140;
                    genie.droplets.push({
                        x, y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed * dirY,
                        r: 3.5 + Math.random() * 5.5,
                        life: 1,
                        color
                    });
                }
            }

            function drawGenieFunnel(mode, p, box, orbPt, accentHex) {
                let yTop, yBot, topHW, botHW, topCX, botCX;

                if (mode === "collapse") {
                    const p145 = Math.pow(p, 1.45);
                    const tTop = Math.pow(p, 1.85);
                    const tBot = Math.min(1, p * 1.48);
                    const p215 = Math.min(1, p * 2.15);
                    yTop = box.top + (orbPt.y - orbPt.r * 0.25 - box.top) * tTop;
                    yBot = box.bottom + (orbPt.y - box.bottom) * tBot;
                    topHW = (box.width * 0.5) * (1 - p145) + orbPt.r * 0.28 * p145;
                    botHW = (box.width * 0.5) * (1 - p215) + orbPt.r * 0.22 * p215;
                    topCX = box.cx + (orbPt.x - box.cx) * Math.pow(p, 1.7);
                    botCX = box.cx + (orbPt.x - box.cx) * Math.min(1, p * 1.55);
                } else {
                    const invP = 1 - p;
                    const tTop = 1 - Math.pow(invP, 2.25);
                    const tBot = Math.max(0, (p - 0.2) * 1.25);
                    const easeBot = 1 - Math.pow(1 - tBot, 1.8);
                    yTop = orbPt.y - orbPt.r * 0.25 + (box.top - (orbPt.y - orbPt.r * 0.25)) * tTop;
                    yBot = orbPt.y + (box.bottom - orbPt.y) * easeBot;
                    topHW = orbPt.r * 0.28 + (box.width * 0.5 - orbPt.r * 0.28) * tTop;
                    botHW = orbPt.r * 0.22 + (box.width * 0.5 - orbPt.r * 0.22) * Math.pow(easeBot, 1.3);
                    topCX = orbPt.x + (box.cx - orbPt.x) * tTop;
                    botCX = orbPt.x + (box.cx - orbPt.x) * easeBot;
                }

                const heightSpan = Math.max(8, yBot - yTop);
                const capCurve = Math.min(28, topHW * 0.35, heightSpan * 0.28);
                const midY1 = yTop + heightSpan * 0.56;
                const midY2 = yTop + heightSpan * 0.44;

                const alpha = mode === "collapse"
                    ? Math.min(1, p * 3.2) * (1 - p * p * p * p * p)
                    : Math.sin(Math.min(1, p) * Math.PI) * 0.95;

                if (alpha <= 0.01) return;

                gCtx.save();
                gCtx.globalAlpha = Math.max(0, Math.min(1, alpha));

                gCtx.beginPath();
                gCtx.moveTo(topCX - topHW + capCurve, yTop);
                gCtx.quadraticCurveTo(topCX, yTop - capCurve * 0.35, topCX + topHW - capCurve, yTop);
                gCtx.quadraticCurveTo(topCX + topHW, yTop, topCX + topHW, yTop + capCurve);
                gCtx.bezierCurveTo(topCX + topHW, midY1, botCX + botHW, midY2, botCX + botHW, yBot);
                gCtx.quadraticCurveTo(botCX, yBot + 10, botCX - botHW, yBot);
                gCtx.bezierCurveTo(botCX - botHW, midY2, topCX - topHW, midY1, topCX - topHW, yTop + capCurve);
                gCtx.quadraticCurveTo(topCX - topHW, yTop, topCX - topHW + capCurve, yTop);
                gCtx.closePath();

                const grad = gCtx.createLinearGradient(topCX, yTop, botCX, yBot);
                grad.addColorStop(0, "rgba(255, 255, 255, 0.86)");
                grad.addColorStop(0.38, "rgba(205, 248, 255, 0.68)");
                grad.addColorStop(0.78, accentHex + "99");
                grad.addColorStop(1, "rgba(255, 255, 255, 0.92)");
                gCtx.fillStyle = grad;
                gCtx.fill();

                gCtx.lineWidth = 2.2;
                gCtx.strokeStyle = "rgba(255, 255, 255, 0.94)";
                gCtx.stroke();

                gCtx.beginPath();
                gCtx.moveTo(topCX - topHW * 0.52, yTop + capCurve * 0.7);
                gCtx.bezierCurveTo(
                    topCX - topHW * 0.52, midY1,
                    botCX - botHW * 0.45, midY2,
                    botCX - botHW * 0.35, yBot - 4
                );
                gCtx.lineWidth = Math.max(2, topHW * 0.14);
                gCtx.lineCap = "round";
                gCtx.strokeStyle = "rgba(255, 255, 255, 0.62)";
                gCtx.stroke();

                gCtx.restore();
            }

            function refreshActiveCardBoxFromOffsets() {
                const sampleCard = cardEls[activeCardIdx];
                if (!sampleCard) return;
                const w = sampleCard.offsetWidth;
                const h = sampleCard.offsetHeight;
                if (w > 60 && h > 60) {
                    const cy = (cachedStageBox.top + cachedStageBox.bottom) * 0.5;
                    cachedStageBox = {
                        cx: cachedStageBox.cx,
                        top: cy - h * 0.5,
                        bottom: cy + h * 0.5,
                        width: w
                    };
                }
            }

            function selectProfile(targetIdx) {
                const clamped = Math.max(0, Math.min(PROFILES.length - 1, targetIdx));
                dockTarget = clamped;

                if (clamped === activeProfileIdx && genie.phase === "idle") {
                    orbSprings[clamped].vel += 2.6;
                    cardJellyVel += 1.8;
                    if (activeCardIdx !== 0) goToCard(0);
                    else playWaterBloop(380, 680, 0.08, 0.07);
                    wakePhysics();
                    return;
                }

                const prevIdx = genie.phase === "collapse" ? genie.fromIdx : activeProfileIdx;
                refreshActiveCardBoxFromOffsets();
                genie.cardBox = cachedStageBox;
                genie.fromIdx = prevIdx;
                genie.toIdx = clamped;
                genie.accentFrom = PROFILES[prevIdx]?.accent || "#00d4ff";
                genie.accentTo = PROFILES[clamped]?.accent || "#00d4ff";
                genie.phase = "collapse";
                genie.t = 0;

                // Ensure target profile DOM is ready ahead of the expand phase
                createProfileDom(clamped);

                playWaterBloop(580, 260, 0.11, 0.08);
                navigator.vibrate?.(8);
                wakePhysics();
            }

            function goToCard(idx) {
                const maxIdx = Math.max(0, cardEls.length - 1);
                const next = Math.max(0, Math.min(maxIdx, idx));
                if (next !== activeCardIdx) {
                    playWaterBloop(340, 640, 0.075, 0.065);
                }
                activeCardIdx = next;
                cardJellyVel += 1.4;
                syncPaginationDots();
                wakePhysics();
            }

            /* Render Bottom Dock (runs before Card transforms so orbMetrics are fresh) */
            function renderDockTransforms() {
                const isLandscapeShort = vpH <= 520 && vpW > vpH;
                const isFoldable = vpW >= 600 && vpH >= 560;
                const spacing = isLandscapeShort ? 54 : (isFoldable ? 82 : 66);
                const magnifyPush = isLandscapeShort ? 13 : (isFoldable ? 24 : 19);

                const focusedIdx = Math.max(0, Math.min(PROFILES.length - 1, Math.round(dockPos)));
                if (focusedIdx !== lastFocusedPillIdx && PROFILES[focusedIdx]) {
                    lastFocusedPillIdx = focusedIdx;
                    dockFocusPill.textContent = PROFILES[focusedIdx].title;
                }

                if (lastSelectedOrbIdx !== activeProfileIdx) {
                    if (dockOrbEls[lastSelectedOrbIdx]) dockOrbEls[lastSelectedOrbIdx].classList.remove("is-selected");
                    if (dockOrbEls[activeProfileIdx]) dockOrbEls[activeProfileIdx].classList.add("is-selected");
                    lastSelectedOrbIdx = activeProfileIdx;
                }

                const velStretch = Math.min(0.14, Math.abs(dockVel) * 0.03);
                const magPeak = isLandscapeShort ? 0.68 : 0.78;
                const magBase = 0.74;

                for (let i = 0; i < dockOrbEls.length; i++) {
                    const orb = dockOrbEls[i];
                    const cache = orbRenderCache[i];
                    const d = i - dockPos;
                    const absD = Math.abs(d);

                    const x = d * spacing + Math.tanh(d * 1.8) * magnifyPush;
                    const arcLift = isLandscapeShort
                        ? Math.min(absD * absD * 5.5, 14) - 10
                        : Math.min(absD * absD * 9.5, 24) - 16;
                    const mag = Math.max(0.64, magBase + magPeak * Math.exp(-(d * d) / 0.42));

                    // Keep mathematical screen position updated for Genie
                    const m = orbMetrics[i];
                    m.x = dockOriginX + x;
                    m.y = dockOriginY + arcLift;
                    m.r = Math.max(22, dockBaseOrbRadius * mag);

                    if (absD > 3.8) {
                        if (cache.visible) {
                            cache.visible = false;
                            orb.style.opacity = "0";
                            orb.style.pointerEvents = "none";
                        }
                        continue;
                    }

                    if (!cache.visible) {
                        cache.visible = true;
                        orb.style.pointerEvents = "auto";
                    }

                    const s = orbSprings[i].pos * 0.13 - velStretch;
                    const sy = mag * (1 + s);
                    const sx = mag * (1 / Math.max(0.75, 1 + s * 0.7));
                    const opacity = Math.max(0, 1 - Math.max(0, absD - 2.15) * 0.78);
                    const z = 25 - Math.round(absD * 5);

                    if (cache.z !== z) {
                        cache.z = z;
                        orb.style.zIndex = String(z);
                    }
                    orb.style.opacity = opacity.toFixed(3);
                    orb.style.transform = `translate3d(${x.toFixed(1)}px, ${arcLift.toFixed(1)}px, 0) scale3d(${sx.toFixed(3)}, ${sy.toFixed(3)}, 1)`;
                }
            }

            /* Render Top Info Bubbles (visibility instead of display:none to avoid flexbox reflow) */
            function renderCardTransforms() {
                const isFoldableWide = vpW >= 600 && vpH >= 560;
                const spreadPx = isFoldableWide ? Math.min(vpW * 0.66, 460) : vpW * 0.88;
                const fadeThreshold = isFoldableWide ? 0.55 : 0.25;

                const cSy = Math.max(0.75, Math.min(1.3, 1 + cardJellyStretch));
                const cSx = 1 / cSy;

                let geniePrefix = "";
                let genieAlphaMul = 1;

                if (genie.phase === "collapse") {
                    const p = genie.t;
                    const orbPt = getOrbScreenCenter(genie.fromIdx);
                    const boxCy = (genie.cardBox.top + genie.cardBox.bottom) * 0.5;
                    const dx = (orbPt.x - genie.cardBox.cx) * Math.pow(p, 1.45);
                    const dy = (orbPt.y - boxCy) * Math.pow(p, 1.25);
                    const gSX = Math.max(0.08, 1 - Math.pow(p, 1.15) * 0.92);
                    const gSY = Math.max(0.12, 1 - Math.pow(p, 1.65) * 0.88);
                    const gSkew = Math.max(-28, Math.min(28, (orbPt.x - genie.cardBox.cx) * 0.085 * p));
                    geniePrefix = `translate3d(${dx.toFixed(1)}px, ${dy.toFixed(1)}px, 0) rotateX(${(-52 * p).toFixed(1)}deg) skewX(${gSkew.toFixed(1)}deg) scale3d(${gSX.toFixed(3)}, ${gSY.toFixed(3)}, 1) `;
                    genieAlphaMul = Math.max(0, 1 - p * 2.15);
                } else if (genie.phase === "expand") {
                    const p = genie.t;
                    const inv = Math.pow(1 - p, 2.1);
                    const orbPt = getOrbScreenCenter(genie.toIdx);
                    const boxCy = (genie.cardBox.top + genie.cardBox.bottom) * 0.5;
                    const dx = (orbPt.x - genie.cardBox.cx) * inv;
                    const dy = (orbPt.y - boxCy) * inv;
                    const gSX = 1 - inv * 0.88;
                    const gSY = 1 - Math.pow(1 - p, 1.6) * 0.85;
                    const gSkew = Math.max(-26, Math.min(26, (orbPt.x - genie.cardBox.cx) * 0.08 * inv));
                    geniePrefix = `translate3d(${dx.toFixed(1)}px, ${dy.toFixed(1)}px, 0) rotateX(${(-48 * inv).toFixed(1)}deg) skewX(${gSkew.toFixed(1)}deg) scale3d(${gSX.toFixed(3)}, ${gSY.toFixed(3)}, 1) `;
                    genieAlphaMul = Math.min(1, Math.max(0, (p - 0.22) * 1.65));
                }

                for (let i = 0; i < cardEls.length; i++) {
                    const el = cardEls[i];
                    const cache = cardRenderCache[i];
                    const rel = i - cardPos;
                    const absRel = Math.abs(rel);

                    if (absRel > 1.35) {
                        if (!cache.hidden) {
                            cache.hidden = true;
                            el.style.visibility = "hidden";
                            el.style.pointerEvents = "none";
                        }
                        continue;
                    }

                    if (cache.hidden) {
                        cache.hidden = false;
                        el.style.visibility = "visible";
                        el.style.pointerEvents = "auto";
                    }

                    const x = rel * spreadPx;
                    const distScale = 1 - Math.min(0.18, absRel * 0.14);
                    const opacity = (1 - Math.min(1, Math.max(0, (absRel - fadeThreshold) * 1.15))) * genieAlphaMul;

                    const sx = (distScale * cSx).toFixed(4);
                    const sy = (distScale * cSy).toFixed(4);
                    const z = 10 - Math.round(absRel * 5);

                    if (cache.z !== z) {
                        cache.z = z;
                        el.style.zIndex = String(z);
                    }
                    el.style.opacity = opacity.toFixed(3);
                    el.style.transform = `${geniePrefix}translate3d(${x.toFixed(1)}px, 0, 0) scale3d(${sx}, ${sy}, 1)`;
                }
            }

            /* Unified Master Physics + Tilt Loop (0% CPU & 0 Canvas Clears when settled) */
            function stepPhysics(now) {
                const dt = Math.min(0.032, Math.max(0.001, (now - lastFrameTime) * 0.001));
                lastFrameTime = now;

                let stillMoving = cardGesture.dragging || dockGesture.dragging;

                // 1. Top Card Slide Spring
                if (!cardGesture.dragging) {
                    const cardForce = (activeCardIdx - cardPos) * 210 - cardVel * 22;
                    cardVel += cardForce * dt;
                    cardPos += cardVel * dt;
                    if (Math.abs(activeCardIdx - cardPos) > 0.0015 || Math.abs(cardVel) > 0.0015) {
                        stillMoving = true;
                    } else {
                        cardPos = activeCardIdx;
                        cardVel = 0;
                    }
                }

                // 2. Top Bubble Incompressible Jelly Oscillation
                if (!cardGesture.dragging) {
                    cardJellyVel += (-cardJellyStretch * 210) * dt;
                    cardJellyVel *= Math.exp(-12 * dt);
                    cardJellyStretch += cardJellyVel * dt;

                    if (Math.abs(cardJellyStretch) > 0.0008 || Math.abs(cardJellyVel) > 0.0008) {
                        stillMoving = true;
                    } else {
                        cardJellyStretch = 0;
                        cardJellyVel = 0;
                    }
                }

                // 3. Bottom Dock Carousel Spring
                if (!dockGesture.dragging) {
                    const dockForce = (dockTarget - dockPos) * 195 - dockVel * 21;
                    dockVel += dockForce * dt;
                    dockPos += dockVel * dt;
                    if (Math.abs(dockTarget - dockPos) > 0.0015 || Math.abs(dockVel) > 0.0015) {
                        stillMoving = true;
                    } else {
                        dockPos = dockTarget;
                        dockVel = 0;
                    }
                }

                // 4. Individual Dock Orb Viscous Squish Springs
                const springDecay = Math.exp(-11 * dt);
                for (let i = 0; i < orbSprings.length; i++) {
                    const s = orbSprings[i];
                    if (s.pos === 0 && s.vel === 0) continue;
                    s.vel += (-s.pos * 240) * dt;
                    s.vel *= springDecay;
                    s.pos += s.vel * dt;
                    if (Math.abs(s.pos) > 0.001 || Math.abs(s.vel) > 0.001) {
                        stillMoving = true;
                    } else {
                        s.pos = 0;
                        s.vel = 0;
                    }
                }

                // 5. Smooth Specular Parallax (deduplicated root CSS updates)
                const dxTilt = tiltState.targetX - tiltState.curX;
                const dyTilt = tiltState.targetY - tiltState.curY;
                if (Math.abs(dxTilt) > 0.001 || Math.abs(dyTilt) > 0.001) {
                    stillMoving = true;
                    const ease = 1 - Math.exp(-10 * dt);
                    tiltState.curX += dxTilt * ease;
                    tiltState.curY += dyTilt * ease;

                    const sx = tiltState.curX.toFixed(3);
                    const sy = tiltState.curY.toFixed(3);
                    if (sx !== tiltState.lastCssX) {
                        tiltState.lastCssX = sx;
                        rootEl.style.setProperty("--tilt-x", sx);
                    }
                    if (sy !== tiltState.lastCssY) {
                        tiltState.lastCssY = sy;
                        rootEl.style.setProperty("--tilt-y", sy);
                    }
                } else if (tiltState.curX !== tiltState.targetX || tiltState.curY !== tiltState.targetY) {
                    tiltState.curX = tiltState.targetX;
                    tiltState.curY = tiltState.targetY;
                    const sx = tiltState.curX.toFixed(3);
                    const sy = tiltState.curY.toFixed(3);
                    if (sx !== tiltState.lastCssX) {
                        tiltState.lastCssX = sx;
                        rootEl.style.setProperty("--tilt-x", sx);
                    }
                    if (sy !== tiltState.lastCssY) {
                        tiltState.lastCssY = sy;
                        rootEl.style.setProperty("--tilt-y", sy);
                    }
                }

                // Update Dock first so orbMetrics are fresh for Genie & Cards
                renderDockTransforms();

                // 6. macOS Genie S-Curve Funnel Choreography (only clears canvas when active/dirty)
                const hasGenieWork = genie.phase !== "idle" || genie.droplets.length > 0;
                if (hasGenieWork || canvasDirty) {
                    gCtx.clearRect(0, 0, vpW, vpH);
                    canvasDirty = hasGenieWork;
                }

                if (genie.phase === "collapse") {
                    stillMoving = true;
                    genie.t += dt / 0.22;
                    const orbFrom = getOrbScreenCenter(genie.fromIdx);

                    if (genie.t >= 1) {
                        orbSprings[genie.fromIdx].vel += 2.8;
                        spawnSplashDroplets(orbFrom.x, orbFrom.y - orbFrom.r * 0.45, genie.accentFrom, 1);

                        activeProfileIdx = genie.toIdx;
                        activeCardIdx = 0;
                        cardPos = 0;
                        cardVel = 0;
                        mountProfileCards(activeProfileIdx);
                        refreshActiveCardBoxFromOffsets();
                        genie.cardBox = cachedStageBox;

                        const orbTo = getOrbScreenCenter(genie.toIdx);
                        orbSprings[genie.toIdx].vel -= 3.4;
                        spawnSplashDroplets(orbTo.x, orbTo.y - orbTo.r * 0.55, genie.accentTo, 1);
                        playWaterBloop(270, 760, 0.13, 0.1);

                        cardJellyVel = -2.2;
                        genie.phase = "expand";
                        genie.t = 0;
                    } else {
                        drawGenieFunnel("collapse", genie.t, genie.cardBox, orbFrom, genie.accentFrom);
                    }
                } else if (genie.phase === "expand") {
                    stillMoving = true;
                    genie.t += dt / 0.32;
                    const orbTo = getOrbScreenCenter(genie.toIdx);

                    if (genie.t >= 1) {
                        genie.phase = "idle";
                        genie.t = 0;
                        cardJellyVel -= 1.5;
                    } else {
                        drawGenieFunnel("expand", genie.t, genie.cardBox, orbTo, genie.accentTo);
                    }
                }

                // Render Genie Splash Micro-Droplets (batched fillStyle)
                if (genie.droplets.length > 0) {
                    stillMoving = true;
                    gCtx.save();
                    gCtx.fillStyle = "#ffffff";
                    for (let i = genie.droplets.length - 1; i >= 0; i--) {
                        const d = genie.droplets[i];
                        d.vy += 420 * dt;
                        d.x += d.vx * dt;
                        d.y += d.vy * dt;
                        d.life -= dt * 2.6;
                        if (d.life <= 0) {
                            genie.droplets.splice(i, 1);
                            continue;
                        }
                        gCtx.globalAlpha = d.life;
                        gCtx.beginPath();
                        gCtx.arc(d.x, d.y, d.r * d.life, 0, Math.PI * 2);
                        gCtx.fill();
                    }
                    gCtx.restore();
                }

                renderCardTransforms();

                if (stillMoving) {
                    requestAnimationFrame(stepPhysics);
                } else {
                    physicsAwake = false;
                }
            }

            /* =======================================================================
               6. GESTURES: TOP BUBBLE SWIPE, BOTTOM DOCK & ZERO-COST OVERSCROLL GUARD
               ======================================================================= */
            const cardGesture = {
                active: false,
                dragging: false,
                pointerId: null,
                startX: 0,
                startY: 0,
                startPos: 0,
                lastX: 0,
                lastT: 0,
                vx: 0,
                wasDragged: false
            };

            stageEl.addEventListener("pointerdown", (e) => {
                if (genie.phase !== "idle") return;
                cardGesture.active = true;
                cardGesture.dragging = false;
                cardGesture.wasDragged = false;
                cardGesture.pointerId = e.pointerId;
                cardGesture.startX = e.clientX;
                cardGesture.startY = e.clientY;
                cardGesture.startPos = cardPos;
                cardGesture.lastX = e.clientX;
                cardGesture.lastT = performance.now();
                cardGesture.vx = 0;
            });

            stageEl.addEventListener("pointermove", (e) => {
                if (!cardGesture.active || e.pointerId !== cardGesture.pointerId) return;
                const dx = e.clientX - cardGesture.startX;
                const dy = e.clientY - cardGesture.startY;

                if (!cardGesture.dragging) {
                    if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 9) {
                        cardGesture.active = false;
                        return;
                    }
                    if (Math.abs(dx) > 8) {
                        cardGesture.dragging = true;
                        cardGesture.wasDragged = true;
                        try { stageEl.setPointerCapture(e.pointerId); } catch (_) { }
                    } else {
                        return;
                    }
                }

                const now = performance.now();
                const dt = Math.max(4, now - cardGesture.lastT);
                cardGesture.vx = ((e.clientX - cardGesture.lastX) / dt) * 16;
                cardGesture.lastX = e.clientX;
                cardGesture.lastT = now;

                const widthRef = Math.max(240, Math.min(vpW * 0.85, 420));
                let rawTarget = cardGesture.startPos - dx / widthRef;

                const maxIdx = Math.max(0, cardEls.length - 1);
                if (rawTarget < 0) rawTarget *= 0.3;
                else if (rawTarget > maxIdx) rawTarget = maxIdx + (rawTarget - maxIdx) * 0.3;

                cardPos = rawTarget;
                cardJellyStretch = Math.max(-0.08, Math.min(0.08, -Math.abs(dx) * 0.00035));
                wakePhysics();
            });

            function finishCardGesture(e) {
                if (!cardGesture.active || (e && e.pointerId !== cardGesture.pointerId)) return;
                if (cardGesture.dragging) {
                    const maxIdx = Math.max(0, cardEls.length - 1);
                    const projected = cardPos - cardGesture.vx * 0.045;
                    const nextIdx = Math.max(0, Math.min(maxIdx, Math.round(projected)));
                    cardVel = -cardGesture.vx * 0.04;
                    goToCard(nextIdx);
                    setTimeout(() => { cardGesture.wasDragged = false; }, 60);
                }
                cardGesture.active = false;
                cardGesture.dragging = false;
                cardGesture.vx = 0;
                wakePhysics();
            }
            stageEl.addEventListener("pointerup", finishCardGesture);
            stageEl.addEventListener("pointercancel", finishCardGesture);

            // Bottom Dock Gesture
            const dockGesture = {
                active: false,
                dragging: false,
                pointerId: null,
                startX: 0,
                startPos: 0,
                lastX: 0,
                lastT: 0,
                vx: 0,
                lastTickIdx: 0,
                tappedOrbIdx: -1
            };

            dockStageEl.addEventListener("pointerdown", (e) => {
                dockGesture.active = true;
                dockGesture.dragging = false;
                dockGesture.pointerId = e.pointerId;
                dockGesture.startX = e.clientX;
                dockGesture.startPos = dockPos;
                dockGesture.lastX = e.clientX;
                dockGesture.lastT = performance.now();
                dockGesture.vx = 0;
                dockGesture.lastTickIdx = Math.round(dockPos);

                const clickedOrb = e.target.closest(".dock-orb");
                dockGesture.tappedOrbIdx = clickedOrb ? dockOrbEls.indexOf(clickedOrb) : -1;
                try { dockStageEl.setPointerCapture(e.pointerId); } catch (_) { }
            });

            dockStageEl.addEventListener("pointermove", (e) => {
                if (!dockGesture.active || e.pointerId !== dockGesture.pointerId) return;
                const dx = e.clientX - dockGesture.startX;

                if (!dockGesture.dragging && Math.abs(dx) > 7) {
                    dockGesture.dragging = true;
                }
                if (!dockGesture.dragging) return;

                const now = performance.now();
                const dt = Math.max(4, now - dockGesture.lastT);
                dockGesture.vx = ((e.clientX - dockGesture.lastX) / dt) * 16;
                dockGesture.lastX = e.clientX;
                dockGesture.lastT = now;

                const spacing = vpH <= 520 ? 58 : 72;
                let nextPos = dockGesture.startPos - dx / spacing;
                const maxIdx = Math.max(0, PROFILES.length - 1);

                if (nextPos < 0) nextPos *= 0.28;
                else if (nextPos > maxIdx) nextPos = maxIdx + (nextPos - maxIdx) * 0.28;

                dockPos = nextPos;
                dockVel = -dockGesture.vx * 0.14;

                const rounded = Math.max(0, Math.min(maxIdx, Math.round(dockPos)));
                if (rounded !== dockGesture.lastTickIdx) {
                    dockGesture.lastTickIdx = rounded;
                    orbSprings[rounded].vel -= 1.6;
                    playWaterBloop(450, 680, 0.055, 0.045);
                    navigator.vibrate?.(5);
                }
                wakePhysics();
            });

            function finishDockGesture(e) {
                if (!dockGesture.active || (e && e.pointerId !== dockGesture.pointerId)) return;
                const maxIdx = Math.max(0, PROFILES.length - 1);

                if (dockGesture.dragging) {
                    const projected = dockPos - dockGesture.vx * 0.09;
                    const snapIdx = Math.max(0, Math.min(maxIdx, Math.round(projected)));
                    selectProfile(snapIdx);
                } else if (dockGesture.tappedOrbIdx >= 0) {
                    selectProfile(dockGesture.tappedOrbIdx);
                }

                dockGesture.active = false;
                dockGesture.dragging = false;
                wakePhysics();
            }
            dockStageEl.addEventListener("pointerup", finishDockGesture);
            dockStageEl.addEventListener("pointercancel", finishDockGesture);

            // Overscroll Boundary Guard: resolves scroller ONCE on touchstart (zero getComputedStyle in touchmove)
            let touchGuardStartX = 0;
            let touchGuardStartY = 0;
            let activeTouchScroller = null;

            function findVerticalScroller(target) {
                let node = target instanceof Element ? target : null;
                while (node && node !== document.body && node !== rootEl) {
                    if (node.scrollHeight > node.clientHeight + 1) {
                        const oy = window.getComputedStyle(node).overflowY;
                        if (oy === "auto" || oy === "scroll") return node;
                    }
                    node = node.parentElement;
                }
                return null;
            }

            document.addEventListener("touchstart", (e) => {
                if (e.touches.length !== 1) return;
                touchGuardStartX = e.touches[0].clientX;
                touchGuardStartY = e.touches[0].clientY;
                activeTouchScroller = findVerticalScroller(e.target);
            }, { passive: true });

            document.addEventListener("touchmove", (e) => {
                if (e.touches.length !== 1) return;
                const dx = e.touches[0].clientX - touchGuardStartX;
                const dy = e.touches[0].clientY - touchGuardStartY;

                if (Math.abs(dy) <= Math.abs(dx)) return;

                if (!activeTouchScroller) {
                    if (e.cancelable) e.preventDefault();
                    return;
                }

                const atTop = activeTouchScroller.scrollTop <= 0 && dy > 0;
                const atBottom = activeTouchScroller.scrollTop + activeTouchScroller.clientHeight >= activeTouchScroller.scrollHeight - 1 && dy < 0;
                if ((atTop || atBottom) && e.cancelable) {
                    e.preventDefault();
                }
            }, { passive: false });

            /* =======================================================================
               7. SPECULAR PARALLAX INPUTS & RESIZE HANDLER
               ======================================================================= */
            function setTiltTarget(nx, ny) {
                tiltState.targetX = Math.max(-1, Math.min(1, nx));
                tiltState.targetY = Math.max(-1, Math.min(1, ny));
                wakePhysics();
            }

            window.addEventListener("pointermove", (e) => {
                if (e.pointerType && e.pointerType !== "mouse" && e.pointerType !== "pen") return;
                const nx = (e.clientX / Math.max(1, vpW) - 0.5) * 2;
                const ny = (e.clientY / Math.max(1, vpH) - 0.5) * 2;
                setTiltTarget(nx, ny);
            }, { passive: true });

            document.addEventListener("pointerleave", (e) => {
                if (e.pointerType && e.pointerType !== "mouse" && e.pointerType !== "pen") return;
                setTiltTarget(0, 0);
            }, { passive: true });

            window.addEventListener("deviceorientation", (e) => {
                if (e.gamma == null || e.beta == null) return;
                const nx = Math.max(-1, Math.min(1, e.gamma / 28));
                const ny = Math.max(-1, Math.min(1, (e.beta - 45) / 28));
                setTiltTarget(nx, ny);
            }, { passive: true });

            let resizeRaf = null;
            window.addEventListener("resize", () => {
                cancelAnimationFrame(resizeRaf);
                resizeRaf = requestAnimationFrame(() => {
                    updateLayoutCache();
                    genie.cardBox = cachedStageBox;
                    wakePhysics();
                });
            }, { passive: true });

            /* =======================================================================
               8. BOOT & IDLE PRE-WARMING
               ======================================================================= */
            buildDock();
            mountProfileCards(0);
            updateLayoutCache();
            cardJellyVel = -1.8;
            wakePhysics();

            // Pre-build remaining profile DOMs during idle frames so first-time tab clicks are instant
            const scheduleIdle = window.requestIdleCallback || ((cb) => setTimeout(cb, 120));
            let warmIdx = 1;
            function prewarmNextProfile() {
                if (warmIdx >= PROFILES.length) return;
                createProfileDom(warmIdx++);
                scheduleIdle(prewarmNextProfile);
            }
            scheduleIdle(prewarmNextProfile);
        })();
    </script>
</body>

</html>
